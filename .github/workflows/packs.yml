# Копия лежит в ovr58/subword-packs/.github/workflows/packs.yml. Релиз пакетов по тегу packs-YYYY.MM.N.
name: packs
on:
  push:
    tags: ['packs-*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: ovr58/subword
          ref: ${{ vars.SUBWORD_REF }}
          token: ${{ secrets.SUBWORD_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - name: Каталог исходников
        run: echo "SRC=$RUNNER_TEMP/src" >> "$GITHUB_ENV"
      - name: Версия из тега
        run: |
          case "$TAG" in packs-[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9]*) ;; *) echo "тег $TAG не packs-YYYY.MM.N"; exit 1;; esac
          echo "VERSION=${TAG#packs-}" >> "$GITHUB_ENV"
      - name: Исходники (SHA-256 из sources.json)
        run: node tools/packs/fetch-sources.mjs --out "$SRC"
      - name: Раскол дампа
        run: node tools/packs/split-dump.mjs --kaikki "$SRC/kaikki-raw-wiktextract-data.jsonl.gz" --out "$SRC/split"
      - name: Индекс пивота
        run: node tools/packs/build-index.mjs --split "$SRC/split" --out "$SRC/pivot-index.json.gz"
      - name: Формы Simplemma
        run: python -I tools/packs/simplemma-dump.py --wheel "$SRC"/simplemma-*.whl --lang de --out "$SRC/de.tsv"
      - name: Словари en и de
        run: |
          node tools/packs/build.mjs --source en --kaikki "$SRC/split/en.jsonl.gz" --ruwikt "$SRC/ruwikt-raw-wiktextract-data.jsonl.gz" --freq "$SRC/freq-en_full.txt" --top 100000 --version "$VERSION" --out dist-packs
          node tools/packs/build.mjs --source de --kaikki "$SRC/split/de.jsonl.gz" --ruwikt "$SRC/ruwikt-raw-wiktextract-data.jsonl.gz" --freq "$SRC/freq-de-de_full.txt" --simplemma "$SRC/de.tsv" --top 100000 --dewikt "$SRC/dewikt-raw-wiktextract-data.jsonl.gz" --version "$VERSION" --out dist-packs
          node tools/packs/build.mjs --source en --target en --kaikki "$SRC/split/en.jsonl.gz" --freq "$SRC/freq-en_full.txt" --top 100000 --version "$VERSION" --out dist-packs
          node tools/packs/build.mjs --source de --target en --kaikki "$SRC/split/de.jsonl.gz" --freq "$SRC/freq-de-de_full.txt" --simplemma "$SRC/de.tsv" --top 100000 --version "$VERSION" --out dist-packs
          node tools/packs/build.mjs --source ka --target ru --pivot dist-packs/en-ru.json.gz --kaikki "$SRC/split/ka.jsonl.gz" --index "$SRC/pivot-index.json.gz" --version "$VERSION" --out dist-packs
          node tools/packs/build.mjs --source ka --target en --kaikki "$SRC/split/ka.jsonl.gz" --version "$VERSION" --out dist-packs
      - name: Словари языков
        run: |
          node --max-old-space-size=12288 tools/packs/build-lang.mjs --source en --kaikki "$SRC/split/en.jsonl.gz" --ruwikt "$SRC/ruwikt-raw-wiktextract-data.jsonl.gz" --freq "$SRC/freq-en_full.txt" --top 100000 --version "$VERSION" --out dist-packs
          node --max-old-space-size=12288 tools/packs/build-lang.mjs --source de --kaikki "$SRC/split/de.jsonl.gz" --ruwikt "$SRC/ruwikt-raw-wiktextract-data.jsonl.gz" --freq "$SRC/freq-de-de_full.txt" --simplemma "$SRC/de.tsv" --top 100000 --pivot dist-packs/en.json.gz --index "$SRC/pivot-index.json.gz" --dewikt "$SRC/dewikt-raw-wiktextract-data.jsonl.gz" --version "$VERSION" --out dist-packs
          node --max-old-space-size=12288 tools/packs/build-lang.mjs --source ka --kaikki "$SRC/split/ka.jsonl.gz" --pivot dist-packs/en.json.gz --index "$SRC/pivot-index.json.gz" --dewikt "$SRC/dewikt-raw-wiktextract-data.jsonl.gz" --version "$VERSION" --out dist-packs
          node --max-old-space-size=12288 tools/packs/build-lang.mjs --source ru --kaikki "$SRC/split/ru.jsonl.gz" --freq "$SRC/freq-ru-ru_full.txt" --top 3000000 --pivot dist-packs/en.json.gz --index "$SRC/pivot-index.json.gz" --dewikt "$SRC/dewikt-raw-wiktextract-data.jsonl.gz" --version "$VERSION" --out dist-packs
      - name: Сверка З1
        run: |
          for p in en/en-ru en/en-en de/de-ru de/de-en ka/ka-ru ka/ka-en; do node tools/packs/compare-lang.mjs --lang "dist-packs/${p%/*}.json.gz" --pair "dist-packs/${p#*/}.json.gz"; done
      - name: Сканер
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -xzf "$SRC/freq-ka-kat_news_2020_100K.tar.gz" -C "$SRC"
          # прежний latest (без тега gh берёт latest, а не новейший по дате); нет ассета quality.json — без гейта (первый выпуск после фикса)
          PREV=$(gh release view --repo ovr58/subword-packs --json tagName -q .tagName || true)
          gh release download "$PREV" --repo ovr58/subword-packs -p quality.json -D prev || true
          mkdir -p dist-quality
          if [ -f prev/quality.json ]; then
            node tools/packs/scan-quality.mjs --dir dist-packs --index "$SRC/pivot-index.json.gz" --freq-dir "$SRC" --out dist-quality/quality.json --gate prev/quality.json
          else
            node tools/packs/scan-quality.mjs --dir dist-packs --index "$SRC/pivot-index.json.gz" --freq-dir "$SRC" --out dist-quality/quality.json
          fi
      - name: Файлы словарей
        run: |
          for f in dist-packs/*.json.gz; do node tools/packs/pack-files.mjs --in "$f" --out dist-packs; done
      - name: Модели en-ru и de-ru
        run: |
          node tools/packs/build-mt.mjs --pair en-ru --version "$VERSION" --out dist-packs
          node tools/packs/build-mt.mjs --pair de-ru --version "$VERSION" --out dist-packs
          node tools/packs/build-mt.mjs --pair de-en --version "$VERSION" --out dist-packs
          node tools/packs/build-mt.mjs --pair ru-en --version "$VERSION" --out dist-packs
          node tools/packs/build-mt.mjs --pair en-de --version "$VERSION" --out dist-packs
      - name: Пакет голоса tts-ka
        run: |
          node tools/packs/build-tts.mjs --lang ka --onnx "$SRC/tts-ka-onnx-ka_GE-natia-medium.onnx" --json "$SRC/tts-ka-json-ka_GE-natia-medium.onnx.json" --data "$SRC/tts-ka-data-piper_phonemize.data" --version "$VERSION" --out dist-packs
      - name: Манифест и подпись
        env:
          MANIFEST_SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "$MANIFEST_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          node tools/packs/manifest.mjs --dir dist-packs --tag "$TAG" --repo ovr58/subword-packs --sign "$RUNNER_TEMP/key.pem" --mt-attribution 'Translation models © Mozilla, mozilla/translations, MPL-2.0' --mt-license MPL-2.0 --tts-attribution 'Piper voice ka_GE-natia-medium, rhasspy/piper-voices' --tts-license 'See LICENSE file'
          rm -f "$RUNNER_TEMP/key.pem"
      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist-packs/* dist-quality/quality.json --repo ovr58/subword-packs --title "$TAG" --notes "Packs $VERSION"
